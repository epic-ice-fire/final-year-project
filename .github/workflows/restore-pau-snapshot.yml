name: Restore PAU-only UniCart snapshot
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-pau-snapshot.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Copy original UniCart source into this repository
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/epic-ice-fire/unicart_app.git /tmp/unicart-source
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/unicart-source/ ./
      - name: Commit and push the PAU-only snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source and destination already match."
            exit 0
          fi
          git commit -m "Restore original PAU-centric UniCart project snapshot"
          git push origin HEAD:main
